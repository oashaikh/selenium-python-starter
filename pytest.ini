[pytest]
testpaths = tests
norecursedirs = venv .venv __pycache__ test-results
addopts =
    -ra
    --strict-markers
    --tb=short
    --html=report.html
    --self-contained-html
    --junitxml=junit.xml
markers =
    smoke: minimum-viable subset run on every PR
    regression: full regression pass run before release
    headless: tests that run browser-less (e.g. unit tests of page-object logic)
    flaky: retried automatically (use sparingly)
filterwarnings =
    ignore::DeprecationWarning
