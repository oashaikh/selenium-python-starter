name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Run unit tests (no browser)
        run: pytest -m headless

      - name: Run smoke (browser)
        env:
          BROWSER: ${{ matrix.browser }}
          HEADED: 0
        run: pytest -m "smoke and not headless"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.browser }}
          path: |
            test-results/
            report.html
            junit.xml
